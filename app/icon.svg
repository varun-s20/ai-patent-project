<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The navbar's gold-foil tile + patent medallion (components/site-nav.tsx,
       components/ui/icons.tsx Patent), flattened to 32px. Stroke is thickened
       from 1.4 to 2.1 so the glyph survives a 16px tab; the tile's ring and
       drop shadow are dropped — both read as mud at favicon size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4c45a"/>
      <stop offset="1" stop-color="#c8a020"/>
    </linearGradient>
    <linearGradient id="gloss" x1="16" y1="0" x2="16" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <rect width="32" height="32" rx="8" fill="url(#gloss)"/>
  <g transform="translate(7 7) scale(.75)" fill="none" stroke="#0d1626"
     stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8.5" r="5.5"/>
    <path d="m9.6 8.7 1.7 1.7 3.1-3.3"/>
    <path d="M8.7 13.3 7 21l5-2.6 5 2.6-1.7-7.7"/>
  </g>
</svg>
